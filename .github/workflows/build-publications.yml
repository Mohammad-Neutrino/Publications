name: Compile Publications PDF

on:
  push:
    branches: [trunk]
    paths:
      - 'main.tex'
      - 'collaborative_publications.tex'
      - 'latexmkrc'
      - '.github/workflows/build-publications.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          latexmk_use_xelatex: true

      - name: Prepare Publications.pdf
        run: |
          test -s main.pdf
          cp main.pdf Publications.pdf

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Publications.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Publications PDF"
            git push
          fi
